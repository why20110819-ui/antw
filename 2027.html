<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>距離 ANTW 上架還有｜台灣匿名平台</title>
<link rel="stylesheet" href="/antw/os/ui/index.css">
</head>
<body>
<div class="page">
  <main class="card">
    <div class="card-head">
      <div class="badge">ANTW</div>
      <h1>台灣匿名平台</h1>
      <p>2027.01.01 00:00 正式上架</p>
    </div>

    <div class="card-body">
      <section class="block countdown">
        <h2 id="cd-title">距離 ANTW 上架還有</h2>
        <div class="timer" id="timer" role="timer" aria-labelledby="cd-title">
          <div class="unit"><b id="cd-d">--</b><span>天</span></div>
          <div class="unit"><b id="cd-h">--</b><span>時</span></div>
          <div class="unit"><b id="cd-m">--</b><span>分</span></div>
          <div class="unit"><b id="cd-s">--</b><span>秒</span></div>
        </div>
        <p class="cd-note" id="cd-note">以台灣時間 2027 年 1 月 1 日 0:00 為準</p>
      </section>

      <div class="figure" aria-hidden="true">
        <svg viewBox="0 0 120 160" width="140" height="187">
          <defs>
            <linearGradient id="bodyg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2563eb"/>
              <stop offset="1" stop-color="#4f46e5"/>
            </linearGradient>
          </defs>
          <ellipse class="shadow" cx="60" cy="152" rx="26" ry="5" fill="#94a3b8" opacity=".35"/>
          <g class="sway">
            <line x1="52" y1="104" x2="52" y2="142" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
            <line x1="68" y1="104" x2="68" y2="142" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
            <g class="arm-l"><line x1="44" y1="68" x2="22" y2="94" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/></g>
            <g class="arm-r"><line x1="76" y1="68" x2="98" y2="94" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/></g>
            <rect x="42" y="56" width="36" height="52" rx="14" fill="url(#bodyg)"/>
            <circle cx="60" cy="36" r="19" fill="#ffe4c4" stroke="#1e293b" stroke-width="3"/>
            <circle cx="53" cy="34" r="2.4" fill="#1e293b"/>
            <circle cx="67" cy="34" r="2.4" fill="#1e293b"/>
            <path d="M52 43 Q60 50 68 43" fill="none" stroke="#1e293b" stroke-width="2.6" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <a class="btn ghost" href="/">回首頁</a>
    </div>
  </main>
</div>
<script src="/antw/os/ui/2027.js" defer></script>
</body>
</html>
